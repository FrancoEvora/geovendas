<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100d"><title>Évora Mavic 3E Live</title><body style="margin:0;background:#07100d;color:#fff;font:16px system-ui;display:grid;place-items:center;min-height:100vh"><div>Carregando Évora Spatial…</div><script>Promise.all([1,2,3,4].map(n=>fetch('/p'+n+'.txt').then(r=>{if(!r.ok)throw Error(r.status);return r.text()}))).then(a=>{let b=atob(a.join('').replace(/\s/g,'')),u=Uint8Array.from(b,c=>c.charCodeAt(0));document.open();document.write(new TextDecoder().decode(u));document.close()}).catch(e=>document.body.innerHTML='<div>Falha ao carregar: '+e.message+'</div>')</script>
